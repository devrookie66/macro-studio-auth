<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authorize Macro Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Caveat:wght@700&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #080808;
      --card-bg: rgba(13, 13, 13, 0.98);
      --border: rgba(255, 255, 255, 0.05);
      --primary: #fbbf24;
      --primary-glow: rgba(251, 191, 36, 0.15);
      --success: #4ade80;
      --success-glow: rgba(74, 222, 128, 0.15);
      --danger: #f87171;
      --text: #efefef;
      --text-muted: #888;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px 32px;
      text-align: center;
      max-width: 380px;
      width: 90%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .brand-signature {
      font-family: 'Caveat', cursive;
      font-size: 16px;
      color: var(--primary);
      transform: rotate(-5deg);
      display: inline-block;
    }

    .spinner {
      box-sizing: border-box;
      width: 44px;
      height: 44px;
      border: 3px solid rgba(251, 191, 36, 0.05);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .icon {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: bold;
      animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .icon.success {
      background: var(--success-glow);
      border: 1px solid var(--success);
      color: var(--success);
    }

    .icon.error {
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid var(--danger);
      color: var(--danger);
    }

    h1 {
      font-size: 15px;
      font-weight: 700;
      margin: 0;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    p {
      color: var(--text-muted);
      font-size: 11px;
      line-height: 1.5;
      margin: 0;
    }

    .id-badge {
      font-family: monospace;
      font-size: 9px;
      background: rgba(255, 255, 255, 0.02);
      padding: 3px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--primary);
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes pop {
      0% {
        transform: scale(0.6);
        opacity: 0;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <div class="container" id="app">
    <div class="brand">MACRO STUDIO <span class="brand-signature">by reil</span></div>
    <div class="spinner" id="state-icon"></div>
    <h1 id="state-title" style="color: var(--primary);">COMPLETING AUTHORIZATION...</h1>
    <p id="state-desc">Exchanging credentials and authorizing your desktop application. Please do not close this window.
    </p>
    <div class="id-badge" id="id-badge" style="display:none;"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const reqId = urlParams.get('reqId');

    const supabaseUrl = 'https://dkurwguarhzskzqsqgeu.supabase.co';
    const supabaseAnonKey = 'sb_publishable_RBiROPwf0sEykyxTiaqVMA_i6TQ-IS5';

    const appEl = document.getElementById('app');
    const iconEl = document.getElementById('state-icon');
    const titleEl = document.getElementById('state-title');
    const descEl = document.getElementById('state-desc');
    const badgeEl = document.getElementById('id-badge');

    if (reqId) {
      badgeEl.textContent = `ID: ${reqId}`;
      badgeEl.style.display = 'block';
    }

    if (!reqId) {
      showError("Link Expired or Invalid", "No request ID found in the URL. Please return to the desktop app and initiate sign-in again.");
    } else {
      try {
        const supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey, {
          auth: {
            flowType: 'implicit',
            detectSessionInUrl: true,
            persistSession: false
          }
        });

        let sessionHandled = false;

        async function handleSession(session) {
          if (!session || sessionHandled) return;
          sessionHandled = true;

          try {
            const { data, error } = await supabase
              .rpc('store_handshake_session', {
                req_id: reqId,
                access_token: session.access_token,
                refresh_token: session.refresh_token
              });

            if (error) throw error;
            if (data && !data.success) throw new Error(data.message);
            showSuccess();
          } catch (err) {
            sessionHandled = false; // allow retry
            console.error("Authorization error details:", err);
            showError("Authorization Failed", "A temporary connection issue occurred. Please return to the desktop application and try signing in again.");
          }
        }

        // 1. Explicitly check the session immediately on load
        supabase.auth.getSession().then(({ data: { session } }) => {
          if (session) {
            handleSession(session);
          }
        });

        // 2. Listen to state changes
        supabase.auth.onAuthStateChange(async (event, session) => {
          if (session) {
            handleSession(session);
          }
        });
      } catch (err) {
        showError("Initialization Failed", err.message || err);
      }
    }

    function showSuccess() {
      iconEl.className = 'icon success';
      iconEl.textContent = '✓';
      titleEl.textContent = 'SIGN IN SUCCESSFUL';
      titleEl.style.color = 'var(--success)';
      descEl.textContent = 'You have successfully signed into Macro Studio! You can now safely close this browser tab and return to the desktop application.';
    }

    function showError(title, desc) {
      iconEl.className = 'icon error';
      iconEl.textContent = '✕';
      titleEl.textContent = title;
      titleEl.style.color = 'var(--danger)';
      descEl.textContent = desc;
    }
  </script>
</body>

</html>
